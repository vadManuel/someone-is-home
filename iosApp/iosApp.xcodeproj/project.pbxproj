			shellPath = /bin/sh;
			shellScript = "# Builds SomeoneIsHomeKit and copies Compose resources into the bundle, so an Xcode\n# build is never one revision behind the Kotlin it claims to contain.\n#\n# THE SECOND STEP IS NOT OPTIONAL. Linking the framework alone produces an app that\n# builds, installs, launches, and then dies on its first frame with\n# MissingResourceException on Silkscreen-Regular.ttf -- the pixel fonts live in :ui's\n# composeResources and a static framework does not carry them. The fonts ARE the\n# interface; substituting a system face does not degrade the look, it deletes it.\nset -e\ncd \"$SRCROOT/..\"\n# The Gradle wrapper needs a JDK on PATH; Xcode's build environment does not inherit\n# the user's shell.\nexport PATH=\"$HOME/.local/share/mise/shims:$PATH\"\n# Three configurations, three variants (story 0.10b). Playtest links the RELEASE-kind\n# framework -- the monthly session measures the numbers the anonymity guarantee rests\n# on, and an unoptimised build would measure a phone nobody plays.\ncase \"$CONFIGURATION\" in\n  Release) KIND=Release; VARIANT=release ;;\n  Playtest) KIND=Release; VARIANT=playtest ;;\n  *) KIND=Debug; VARIANT=debug ;;\nesac\ncase \"$SDK_NAME\" in\n  iphonesimulator*) KTARGET=IosSimulatorArm64 ;;\n  *) KTARGET=IosArm64 ;;\nesac\n./gradlew --quiet \":app:link${KIND}Framework${KTARGET}\" \"-Pvariant=$VARIANT\"\nexport KOTLIN_FRAMEWORK_BUILD_TYPE=\"$(echo \"$KIND\" | tr '[:upper:]' '[:lower:]')\"\n./gradlew --quiet \":app:syncComposeResourcesForIos\" \"-Pvariant=$VARIANT\"\n";
		};
